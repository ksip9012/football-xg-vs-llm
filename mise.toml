[tools]
# 版の選び方: Python は最新の 1つ前のマイナー版。毎年 11月に見直す（dotfiles の decisions/0007-language-versions）
python = "3.14"
uv = "0.13.6"

[env]
# uv が自分で Python を探さず、上の [tools] で mise が入れた Python を使うようにする
# （版を決める場所を mise.toml の 1か所にする）
UV_PYTHON_PREFERENCE = "only-system"

# 手元・pre-commit・CI で同じチェックを動かす（dotfiles の decisions/0003-checks-in-mise-tasks）
# ruff・pyright・pytest の版は uv.lock で固定する
[tasks.check]
description = "lint・format・型チェック・速いテスト"
run = [
  "uv run ruff check .",
  "uv run ruff format --check .",
  "uv run pyright",
  "uv run pytest -m 'not slow'",
]

[tasks.fetch]
description = "元データ（data/sources.toml）を落として sha256 を確かめる"
run = "uv run python -m football_xg_vs_llm.sources"

[tasks.shots]
description = "data/raw/events.zip からシュートの表 data/shots.csv を作る（decisions/0002）"
run = "uv run python -m football_xg_vs_llm.shots"

[tasks.xg]
description = "最初の xG を numpy・scikit-learn・statsmodels の 3通りで作って比べる（decisions/0004）"
run = "uv run python -m football_xg_vs_llm.compare"

[tasks.xg-cv]
description = "試合単位の 5分割の交差検証で、シュートごとの xG を data/xg_stat.csv に出す（decisions/0005）"
run = "uv run python -m football_xg_vs_llm.cv"

[tasks.aggregate]
description = "選手・チーム・大会ごとに集計し、決定力が本物かを確かめる（data/aggregates/）"
run = "uv run python -m football_xg_vs_llm.aggregate"

[tasks.figures]
description = "モデルを確かめる図と集計の図を notes/figures/ に作る"
run = "uv run python -m football_xg_vs_llm.figures"

[tasks.fix]
description = "lint の自動修正と format"
run = [
  "uv run ruff check --fix .",
  "uv run ruff format .",
]

# ライブラリと開発の道具を上げる。作業を始めるときに、本来の作業とは別のコミットで回す
# （よく触るリポジトリは月 1回まで。dotfiles の decisions/0008-tool-and-library-upgrades）
[tasks.upgrade]
description = "uv.lock のライブラリを、pyproject.toml の条件の中で最新にしてチェックする"
run = [
  "uv lock --upgrade",
  "mise run check",
]
